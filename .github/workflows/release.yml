name: Publicar versión

# Crea la versión en GitHub Releases al subir una etiqueta, por ejemplo:
#   git tag v2.0.1 && git push origin v2.0.1
# El auto-actualizador de la app lee esta versión (releases/latest).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: La etiqueta coincide con package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "La etiqueta ${{ github.ref_name }} no coincide con la versión v$version de package.json"
            exit 1
          }

      - run: npm ci
      - name: Revisar sintaxis
        shell: pwsh
        run: |
          $files = @('main.js', 'preload.js') + (Get-ChildItem src, scripts, tests -Recurse -Filter *.js).FullName
          foreach ($f in $files) { node --check $f; if ($LASTEXITCODE) { exit 1 } }
      - run: npm test

      # Pre-crea la release como borrador (--draft) para evitar una release pública vacía
      # mientras compila o si falla electron-builder.
      - name: Crear borrador de release en GitHub
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view "$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --draft --title "$tag" --generate-notes
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Firma de código: si existen los secretos CSC_LINK (certificado .pfx en base64 o URL) y
      # CSC_KEY_PASSWORD, electron-builder firma el instalador. Sin ellos, publica sin firmar.
      - name: Compilar y subir artefactos al borrador
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verificar artefactos y publicar release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = (gh release view "$tag" --json assets -q '.assets[].name') -split "`n"
          if (-not ($assets -match '^latest\.yml$') -or -not ($assets -match '\.exe$')) {
            Write-Error "Faltan artefactos obligatorios (latest.yml y .exe) en el borrador $tag"
            exit 1
          }
          gh release edit "$tag" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
