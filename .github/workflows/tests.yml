name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # las pruebas no abren la app
      - name: Revisar sintaxis
        shell: pwsh
        run: |
          $files = @('main.js', 'preload.js') + (Get-ChildItem src -Recurse -Filter *.js).FullName
          foreach ($f in $files) { node --check $f; if ($LASTEXITCODE) { exit 1 } }
      - name: Pruebas
        run: npm test
