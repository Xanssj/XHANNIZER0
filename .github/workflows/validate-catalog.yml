name: Validar catálogo WinGet

on:
  schedule:
    - cron: '0 12 * * 1' # Todos los lunes
  push:
    paths:
      - 'src/backend/catalog.js'
      - 'src/backend/emulators.js'
      - 'catalog-overrides.json'
      - 'scripts/validate-catalog.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar IDs de WinGet
        run: node scripts/validate-catalog.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
